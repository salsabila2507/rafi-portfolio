name: Update X stats

on:
  schedule:
    # every 2 hours, off the hour so the runner queue is not slammed
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-x-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Fetch live stats
        env:
          X_HANDLE: rafi_a11
          X_SESSION_COOKER: ${{ secrets.X_SESSION_COOKER }}
        run: node scripts/fetch-stats.mjs

      - name: Commit when the numbers move
        run: |
          if git diff --quiet -- data/stats.json; then
            echo "No change to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          git commit -m "chore: refresh X stats ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push
